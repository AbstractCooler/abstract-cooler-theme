backend:
  name: github
  repo: AbstractCooler/abstract-cooler-theme
  branch: main
  base_url: https://abstract-cooler-theme.vercel.app
  auth_endpoint: oauth

media_folder: "public/images"
public_path: "/images"

collections:
  - name: "blog"
    label: "Articole Blog"
    folder: "src/content/blog"
    create: true
    fields:
      - {label: "Titlu", name: "title", widget: "string"}
      - {label: "Data publicării", name: "pubDate", widget: "datetime"}
      - {label: "Descriere", name: "description", widget: "string"}
      - {label: "Imagine principală", name: "image", widget: "image"}
      - {label: "Conținut", name: "body", widget: "markdown"}

  - name: "pagini"
    label: "Pagini"
    files:
      - label: "Pagina principală"
        name: "home"
        file: "src/data/content/home.json"
        fields:
          - {label: "Hero - text mic deasupra", name: "heroEyebrow", widget: "string"}
          - {label: "Hero - titlu", name: "heroTitle", widget: "string"}
          - {label: "Hero - subtitlu", name: "heroSubtitle", widget: "text"}
          - {label: "Buton principal - text", name: "primaryButtonLabel", widget: "string"}
          - {label: "Buton principal - link", name: "primaryButtonLink", widget: "string"}
          - {label: "Buton secundar - text", name: "secondaryButtonLabel", widget: "string"}
          - {label: "Buton secundar - link", name: "secondaryButtonLink", widget: "string"}
          - {label: "Casetă clase - titlu", name: "classesTitle", widget: "string"}
          - label: "Casetă clase - listă"
            name: "classes"
            widget: "list"
            fields:
              - {label: "Zi și oră", name: "time", widget: "string"}
              - {label: "Nume", name: "name", widget: "string"}
          - {label: "Casetă clase - notă", name: "classesNote", widget: "string"}
          - label: "Statistici"
            name: "stats"
            widget: "list"
            fields:
              - {label: "Valoare", name: "value", widget: "string"}
              - {label: "Etichetă", name: "label", widget: "string"}
          - {label: "Servicii - text mic", name: "servicesEyebrow", widget: "string"}
          - {label: "Servicii - titlu", name: "servicesTitle", widget: "string"}
          - {label: "Servicii - subtitlu", name: "servicesSubtitle", widget: "string"}
          - {label: "Servicii - text buton", name: "servicesButtonLabel", widget: "string"}
          - {label: "Citat", name: "quote", widget: "text"}
          - {label: "Citat - autor", name: "quoteAuthor", widget: "string"}
          - {label: "Citat - text buton", name: "quoteButtonLabel", widget: "string"}
          - {label: "Citat - notă sub buton", name: "quoteButtonNote", widget: "string"}
          - {label: "Testimoniale - text mic", name: "testimonialsEyebrow", widget: "string"}
          - {label: "Testimoniale - titlu", name: "testimonialsTitle", widget: "string"}
          - {label: "Testimoniale - subtitlu", name: "testimonialsSubtitle", widget: "string"}
          - {label: "Banda finală - text mic", name: "ctaEyebrow", widget: "string"}
          - {label: "Banda finală - titlu", name: "ctaTitle", widget: "string"}
          - {label: "Banda finală - text", name: "ctaText", widget: "text"}
          - {label: "Banda finală - text buton", name: "ctaLabel", widget: "string"}
          - {label: "Banda finală - link buton", name: "ctaLink", widget: "string"}

      - label: "Despre"
        name: "about"
        file: "src/data/content/about.json"
        fields:
          - {label: "Titlu pagină (SEO)", name: "pageTitle", widget: "string"}
          - {label: "Descriere pagină (SEO)", name: "pageDescription", widget: "text"}
          - {label: "Hero - text mic", name: "heroEyebrow", widget: "string"}
          - {label: "Hero - titlu", name: "heroTitle", widget: "string"}
          - {label: "Hero - subtitlu", name: "heroSubtitle", widget: "text"}
          - {label: "Secțiune - titlu", name: "whyTitle", widget: "string"}
          - label: "Secțiune - paragrafe"
            name: "whyParagraphs"
            widget: "list"
            field: {label: "Paragraf", name: "paragraph", widget: "text"}
          - {label: "Casetă - titlu", name: "shortTitle", widget: "string"}
          - label: "Casetă - puncte"
            name: "shortItems"
            widget: "list"
            field: {label: "Punct", name: "item", widget: "string"}
          - {label: "Valori - text mic", name: "valuesEyebrow", widget: "string"}
          - {label: "Valori - titlu", name: "valuesTitle", widget: "string"}
          - {label: "Echipă - text mic", name: "teamEyebrow", widget: "string"}
          - {label: "Echipă - titlu", name: "teamTitle", widget: "string"}
          - {label: "Echipă - subtitlu", name: "teamSubtitle", widget: "string"}
          - {label: "Banda finală - text mic", name: "ctaEyebrow", widget: "string"}
          - {label: "Banda finală - titlu", name: "ctaTitle", widget: "string"}
          - {label: "Banda finală - text", name: "ctaText", widget: "text"}

  - name: "date-site"
    label: "Setări și conținut site"
    files:
      - label: "Setări generale (nume, contact, meniu)"
        name: "site"
        file: "src/data/content/site.json"
        fields:
          - {label: "Nume site", name: "name", widget: "string"}
          - {label: "Slogan", name: "tagline", widget: "string"}
          - {label: "Descriere", name: "description", widget: "text"}
          - {label: "Email", name: "email", widget: "string"}
          - {label: "Telefon", name: "phone", widget: "string"}
          - {label: "Adresă (afișată în site)", name: "address", widget: "string"}
          - {label: "Stradă (pentru Google)", name: "streetAddress", widget: "string"}
          - {label: "Localitate", name: "addressLocality", widget: "string"}
          - {label: "Județ / regiune", name: "addressRegion", widget: "string"}
          - {label: "Țară (cod, ex. RO)", name: "addressCountry", widget: "string"}
          - label: "Program (format Google, ex. Mo-Fr 09:00-18:00)"
            name: "openingHours"
            widget: "list"
            field: {label: "Interval", name: "interval", widget: "string"}
          - {label: "Adresa site-ului (URL)", name: "url", widget: "string"}
          - label: "Meniu"
            name: "navItems"
            widget: "list"
            fields:
              - {label: "Text", name: "label", widget: "string"}
              - {label: "Link", name: "href", widget: "string"}

      - label: "Servicii"
        name: "services"
        file: "src/data/content/services.json"
        fields:
          - label: "Servicii"
            name: "items"
            widget: "list"
            fields:
              - {label: "Titlu", name: "title", widget: "string"}
              - {label: "Descriere", name: "description", widget: "text"}
              - label: "Detalii"
                name: "details"
                widget: "list"
                field: {label: "Detaliu", name: "detail", widget: "string"}
              - {label: "Format (durată, loc)", name: "format", widget: "string"}

      - label: "Prețuri"
        name: "pricing"
        file: "src/data/content/pricing.json"
        fields:
          - label: "Planuri"
            name: "items"
            widget: "list"
            fields:
              - {label: "Nume", name: "name", widget: "string"}
              - {label: "Preț", name: "price", widget: "string"}
              - {label: "Perioadă", name: "period", widget: "string"}
              - {label: "Descriere", name: "description", widget: "text"}
              - label: "Beneficii"
                name: "features"
                widget: "list"
                field: {label: "Beneficiu", name: "feature", widget: "string"}
              - {label: "Evidențiat", name: "highlighted", widget: "boolean", default: false}

      - label: "Echipă și valori"
        name: "team"
        file: "src/data/content/team.json"
        fields:
          - label: "Echipă"
            name: "team"
            widget: "list"
            fields:
              - {label: "Nume", name: "name", widget: "string"}
              - {label: "Rol", name: "role", widget: "string"}
              - {label: "Descriere", name: "bio", widget: "text"}
              - {label: "Inițiale", name: "initials", widget: "string"}
          - label: "Valori"
            name: "values"
            widget: "list"
            fields:
              - {label: "Titlu", name: "title", widget: "string"}
              - {label: "Descriere", name: "description", widget: "text"}

      - label: "Testimoniale"
        name: "testimonials"
        file: "src/data/content/testimonials.json"
        fields:
          - label: "Testimoniale"
            name: "items"
            widget: "list"
            fields:
              - {label: "Text", name: "quote", widget: "text"}
              - {label: "Nume", name: "name", widget: "string"}
              - {label: "Rol / de când e membru", name: "role", widget: "string"}
              - {label: "Inițiale", name: "initials", widget: "string"}
