backend:
  name: github
  repo: AbstractCooler/abstract-cooler-theme
  branch: main
  base_url: https://abstract-cooler-theme.vercel.app
  auth_endpoint: oauth

media_folder: "public/images"
public_path: "/images"

collections:
  - name: "blog"
    label: "Articole Blog"
    folder: "src/content/blog"
    create: true
    fields:
      - {label: "Titlu", name: "title", widget: "string"}
      - {label: "Data publicării", name: "pubDate", widget: "datetime"}
      - {label: "Descriere", name: "description", widget: "string"}
      - {label: "Imagine principală", name: "image", widget: "image"}
      - {label: "Conținut", name: "body", widget: "markdown"}

  - name: "pagini"
    label: "Pagini"
    files:
      - label: "Pagina principală"
        name: "home"
        file: "src/data/home.json"
        fields:
          - {label: "Titlu principal", name: "heroTitle", widget: "string"}
          - {label: "Subtitlu", name: "heroSubtitle", widget: "text"}
          - {label: "Text buton", name: "ctaText", widget: "string"}
      - label: "Despre"
        name: "about"
        file: "src/data/about.json"
        fields:
          - {label: "Titlu", name: "title", widget: "string"}
          - {label: "Conținut", name: "body", widget: "markdown"}
